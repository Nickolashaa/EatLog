name: deploy

on:
  push:
    branches: [main]

jobs:
  to-docker-hub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            file: ./server/api/Dockerfile
          - name: nginx
            file: ./server/nginx/Dockerfile
          - name: bot
            file: ./server/bot/Dockerfile
          - name: scheduler
            file: ./server/scheduler/Dockerfile
          - name: web
            file: ./client/web/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: grachevnr
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: ${{ matrix.file }}
          push: true
          tags: "grachevnr/eat_log_${{ matrix.name }}:latest"

  to-server:
    needs: to-docker-hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Poweroff old services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: docker compose down || true
      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "./server/docker-compose.yaml"
          target: "~/"
          strip_components: 2
      - name: Create .env on server
        uses: appleboy/ssh-action@v1
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,BOT_TOKEN
          script: |
            cat > ~/.env <<EOF
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            BOT_TOKEN=${BOT_TOKEN}
            EOF
      - name: Pull and restart services
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker compose pull
            docker compose up -d
            docker exec -i eat_log_api uv run alembic upgrade head
            docker image prune -f
