name: build

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            file: ./server/api/Dockerfile
          - name: bot
            file: ./server/bot/Dockerfile
          - name: nginx
            file: ./server/nginx/Dockerfile
          - name: scheduler
            file: ./server/scheduler/Dockerfile
          - name: web
            file: ./client/web/Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          file: ${{ matrix.file }}
          push: false
