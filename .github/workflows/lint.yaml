name: lint

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [server/api, server/bot, client/desktop]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
      - name: Setup dependencies
        working-directory: ${{ matrix.dir }}
        run: uv sync
      - name: Launch linters
        working-directory: ${{ matrix.dir }}
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
