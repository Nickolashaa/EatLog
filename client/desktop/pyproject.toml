[project]
name = "eatlog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ariadne-codegen>=0.18.0",
    "pyqt6>=6.11.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "ruff>=0.15.12",
]

[tool.ariadne-codegen]
remote_schema_url = "http://localhost:5285/graphql"
queries_path = "./src/graphql/"
target_package_path = "./src/graphql/"
target_package_name = "client"

[tool.ariadne-codegen.scalars.DateTime]
type = "datetime.datetime"

[tool.ariadne-codegen.scalars.UUID]
type = "uuid.UUID"
