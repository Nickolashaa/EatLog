services:
  api:
    build: ./api/
    env_file: ./api/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5285/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    build: ./nginx/
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
