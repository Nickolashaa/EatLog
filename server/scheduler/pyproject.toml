[project]
name = "eat_log_scheduler"
version = "1.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "apscheduler>=3.11.3",
    "apscheduler-stubs>=0.1.0.dev2",
    "gql",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "ruff>=0.15.20",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "src.graphql.*"
ignore_errors = true

[tool.uv.sources]
gql = { path = "../../shared/gql" }
