[project]
name = "eat_log_api"
version = "1.0.0"
description = "EatLog API"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.29.1",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "sqlalchemy>=2.0.49",
    "strawberry-graphql[cli]>=0.318.1",
    "uvicorn>=0.47.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "src.database.alembic.versions.*"
ignore_errors = true

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "ruff>=0.15.12",
]
