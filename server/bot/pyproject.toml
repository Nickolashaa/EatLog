[project]
name = "eat_log_bot"
version = "1.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.28.2",
    "gql",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "src.graphql.*"
ignore_errors = true

[tool.uv.sources]
gql = { path = "../../shared/gql" }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.16",
]
